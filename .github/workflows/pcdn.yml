name: Build PCDN SRS

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

concurrency:
  group: pcdn-srs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: main

      - name: Install sing-box
        env:
          SB_VERSION: "1.14.3"
        run: |
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 60 \
            "https://github.com/SagerNet/sing-box/releases/download/v${SB_VERSION}/sing-box-${SB_VERSION}-linux-amd64.tar.gz" \
            -o "$RUNNER_TEMP/sing-box.tar.gz"
          tar --no-same-owner -xzf "$RUNNER_TEMP/sing-box.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sing-box-${SB_VERSION}-linux-amd64" >> "$GITHUB_PATH"

      - name: Download and convert
        run: |
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 60 \
            "https://raw.githubusercontent.com/VoidInTheShell/pcdn-block-list/master/pcdn_block_adh.txt" \
            -o pcdn.txt
          test -s pcdn.txt

          if ! sing-box --disable-color rule-set convert \
            --type adguard --output pcdn.srs pcdn.txt \
            > "$RUNNER_TEMP/convert.log" 2>&1; then
            cat "$RUNNER_TEMP/convert.log"
            exit 1
          fi
          if [ -s "$RUNNER_TEMP/convert.log" ]; then
            cat "$RUNNER_TEMP/convert.log"
            echo "Converter emitted messages; review before publishing."
            exit 1
          fi

      - name: Verify SRS and matching
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          data = Path("pcdn.srs").read_bytes()
          if len(data) < 5 or data[:3] != b"SRS":
              raise SystemExit("Invalid SRS file")

          cases = {
              "bsccdn.net": True,
              "x.bsccdn.net": True,
              "cn-p2p-test.chat.bilibili.com": True,
              "trk-123-456.douyucdn.cn": True,
              "notbsccdn.net": False,
              "www.bilibili.com": False,
              "example.com": False,
          }
          for domain, expected in cases.items():
              result = subprocess.run(
                  ["sing-box", "--disable-color", "rule-set", "match",
                   "--format", "binary", "pcdn.srs", domain],
                  capture_output=True, text=True, check=True,
              )
              matched = "match rules." in (result.stdout + result.stderr)
              if matched != expected:
                  raise SystemExit(f"Unexpected match result: {domain}")
              print(f"PASS {domain}: matched={matched}")
          print(f"SRS version={data[3]}, bytes={len(data)}")
          PY

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pcdn.txt pcdn.srs
          if git diff --cached --quiet; then
            echo "Rules unchanged"
            exit 0
          fi
          git commit -m "Update PCDN rules"
          git push origin HEAD:main
